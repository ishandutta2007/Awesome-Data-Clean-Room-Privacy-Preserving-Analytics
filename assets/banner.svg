<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .banner-title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .banner-subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.18;
      stroke-width: 1;
    }

    /* Subtle dynamic CSS animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.7; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.2) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .dynamic-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .dynamic-orb-2 {
      animation: pulseOrb2 10s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dashFlow 2.5s linear infinite;
    }
    .floating-pill-group {
      animation: cardFloat 6s ease-in-out infinite;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Grid Background Pattern -->
  <g class="grid-line">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <g filter="url(#glow)">
    <circle cx="200" cy="110" r="130" fill="#0284c7" class="dynamic-orb-1" />
    <circle cx="1020" cy="310" r="140" fill="#7c3aed" class="dynamic-orb-2" />
    <circle cx="600" cy="50" r="90" fill="#4f46e5" opacity="0.3" />
  </g>

  <!-- Dynamic Flow Connector in Midground -->
  <path d="M 120 330 C 350 370, 850 370, 1080 330" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="flow-line" opacity="0.6" />

  <!-- Clean Room Lock/Vault Graphic (Background Shield) -->
  <g transform="translate(565, 38)" opacity="0.12">
    <path d="M 35 0 L 70 20 L 70 55 C 70 78, 35 95, 35 95 C 35 95, 0 78, 0 55 L 0 20 Z" fill="url(#accentGrad)" />
  </g>

  <!-- Foreground Title and Subtitle Block (Guaranteed Unobscured) -->
  <g transform="translate(70, 70)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="15" r="4" fill="#38bdf8" />
    <text x="26" y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#38bdf8" letter-spacing="1">CURATED TECH DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="75" class="banner-title">
      Awesome Data Clean Room
    </text>
    <text x="0" y="120" class="banner-title" fill="url(#accentGrad)">
      &amp; Privacy-Preserving Analytics
    </text>

    <!-- Subtitle -->
    <text x="0" y="160" class="banner-subtitle">
      Zero-knowledge collaboration, confidential computing, and privacy-first federated algorithms.
    </text>
    <text x="0" y="184" class="banner-subtitle">
      Enterprise SaaS architectures alongside audited open-source frameworks.
    </text>
  </g>

  <!-- Dynamic Feature Badges / Interactive Pills in Foreground Base -->
  <g class="floating-pill-group" transform="translate(70, 290)">
    <!-- Pill 1: TEE & Enclaves -->
    <g transform="translate(0, 0)">
      <rect width="180" height="48" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="25" cy="24" r="7" fill="#0284c7" />
      <text x="42" y="29" class="pill-text">🔒 TEE &amp; Enclaves</text>
    </g>

    <!-- Pill 2: Differential Privacy -->
    <g transform="translate(200, 0)">
      <rect width="210" height="48" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="25" cy="24" r="7" fill="#4f46e5" />
      <text x="42" y="29" class="pill-text">🛡️ Differential Privacy</text>
    </g>

    <!-- Pill 3: Federated Learning -->
    <g transform="translate(430, 0)">
      <rect width="210" height="48" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="25" cy="24" r="7" fill="#7c3aed" />
      <text x="42" y="29" class="pill-text">🌐 Federated Learning</text>
    </g>

    <!-- Pill 4: Secure MPC -->
    <g transform="translate(660, 0)">
      <rect width="180" height="48" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="25" cy="24" r="7" fill="#9333ea" />
      <text x="42" y="29" class="pill-text">🤝 Secure MPC</text>
    </g>

    <!-- Pill 5: Cloud Clean Rooms -->
    <g transform="translate(860, 0)">
      <rect width="200" height="48" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="25" cy="24" r="7" fill="#0369a1" />
      <text x="42" y="29" class="pill-text">☁️ Cloud Clean Rooms</text>
    </g>
  </g>
</svg>
